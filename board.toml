# Nubia Z20 (nx627j, SM8150-AC / Snapdragon 855+) device repository for UniXNU.
#
# nx627j is the SAME SM8150 family as raphael (Redmi K20 Pro), guacamole
# (OnePlus 7 Pro) and nabu (Xiaomi Pad 5): GIC/UFS/timer MMIO and Kryo 485 are
# identical, so the XNU kernel and the Project Aloha UEFI are reused
# unchanged. Only two things are device-specific:
#
#   1. the panel/touch profile in scripts/devices.py ('nx627j' entry), used by
#      scripts/mkadt.py to build the Apple Device Tree;
#   2. the device tree blob the UEFI and the XNU shim read.
#
# STAGE 2 (this file as committed): build-firmware.py generates Aloha's
# `Device/nubia-nx627j` from the raphael template with scripts/aloha_nx627j_device.py
# — the Z20 DTB, 1080x2340 PCDs and Nubia SMBIOS strings; the SM8150 memory map
# and DXE lists are reused as-is.
#
# STAGE 1 (fallback): set TARGET_DEVICE="xiaomi-raphael" and FDT="raphael.dtb"
# below, and scripts/build-firmware.py overwrites raphael's DTB in place.
#
# The payload volume label is kept as "GUACESP" because the patched UniXNU
# firmware discovers the config by that label; it is cosmetic.

[board]
name = "nx627j"
soc = "SM8150"
description = "Nubia Z20 (nx627j, SM8150-AC)"
kit = "nx627j"

[firmware]
# Reused from raphael in stage 1; build-firmware.py mirrors
# Resources/Configs/guacamole.toml to this name.
config = "raphael"
dsc = "Platforms/SurfaceDuo1Pkg/SurfaceDuo1NoSb.dsc"
fd = "Build/SurfaceDuo1Pkg/{target}_CLANGPDB/FV/SM8150_EFI.fd"
submodules = [
  "MU_BASECORE",
  "Common/MU",
  "Common/MU_OEM_SAMPLE",
  "Platforms/CranePkg",
  "Platforms/SurfaceDuoACPI",
  "Features/DFCI",
  "Features/CONFIG",
  "Binaries",
  "Platforms/OpensslPkg/Library/OpensslLib/openssl",
  "Platforms/MbedTlsPkg/Library/MbedTlsLib/mbedtls",
]
packages = [
  "{uefi}/Platforms",
  "{uefi}/Common/MU",
  "{uefi}/Common/MU_OEM_SAMPLE",
  "{uefi}/Features/DFCI",
  "{uefi}/Features/CONFIG",
  "{uefi}/Binaries",
  "{uefi}/Silicon/QC/Sm8150",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

[firmware.defines]
# Stage 2 (default): build-firmware.py generates Device/nubia-nx627j from the
# raphael template via scripts/aloha_nx627j_device.py. The generated dir carries
# the Z20 DTB, 1080x2340 panel PCDs and "Nubia Z20" SMBIOS strings; the SM8150
# memory map and DXE driver lists are reused unchanged.
# To exercise the stage-1 reuse path instead, set this to "xiaomi-raphael" and
# FDT to "raphael.dtb".
TARGET_DEVICE = "nubia-nx627j"
FDT = "nx627j.dtb"
SHARED_CRYPTO_PATH = "{edk2}/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep"
CONF_AUTOGEN_INCLUDE_PATH = "{uefi}/Common/MU/AndromedaPkg/Include"
MU_SCHEMA_DIR = "{uefi}/Common/MU/AndromedaPkg/CfgData"
MU_SCHEMA_FILE_NAME = "AndromedaPkgCfgData.xml"

[payload]
volume = "GUACESP"
size_mib = 64
loader = "firmware"
title = "Nubia Z20 - XNU"
# 3 GiB contiguous kernel window, same as the working SM8150 ports. For a
# 6 GB Z20 this can stay; for 8 GB it is conservative but safe.
dram_size = "0xc0000000"
panic_screen = false
timeout = 3
kernel_args = [
  "debug=0xc",
  "serial=3",
  "cpus=8",
  "keepsyms=1",
  "-enable_kprintf_spam",
  "-noprogress",
  "rd=ufsroot0",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "wdt_test=no_user_checkin",
  "ufsrw=1",
  "rootrw=1",
  "launchd_unsecure_cache=1",
  "wdt=-1",
  "sweetusb=2",
  "sweettouchdelay=20",
  "sweetfb_noconsole=1",
  "sweetfb_hz=30",
  "sweetgpu=3",
  "sweetlogdump=1",
]

[payload.adt]
tool = "scripts/make-nx627j-adt.py"
unique_chip_id = "required"
owned_memory_size = "0xc0000000"

[bootimg.image]
# Confirmed against the Z20's stock boot.img (header v2, page 4096):
# kernel_addr 0x8000, tags_addr 0x100, ramdisk_addr 0x0.
# The stock ramdisk address of 0 is not usable for our payload, so keep the
# documented SM8150 placement (0x800000 at abl_base 0x80000000) that the
# guacamole/raphael bring-up already boots with.
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x800000
abl_base = 0x80000000
tags_offset = 0x100
pagesize = 4096
# The stock image is header v2, but UniXNU packs an Image.gz-dtb (DTB appended
# to the kernel) and the SM8150 ports boot that as v0. Change this to 2 only if
# `fastboot boot` rejects the image with a header error.
header_version = 0
